server {
    listen 5173;
    root   /html/;
    index  index.html;
    location /index.html {
        expires off;
        etag off;
    }

    location /search/assets/ {
        root /html/assets/;
        expires off;
        etag off;
        try_files $uri =404;
    }

    location /search {
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}